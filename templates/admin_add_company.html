{% extends "base.html" %}

{% block title %}Add Company - GreatPoint Ventures{% endblock %}

{% block extra_css %}
<style>
    .hero-section {
        text-align: center;
        padding: 3rem 0 2.5rem;
        margin-bottom: 2.5rem;
        background: linear-gradient(135deg, rgba(10, 37, 64, 0.03) 0%, rgba(201, 169, 97, 0.05) 100%);
        border-bottom: 1px solid var(--gpv-gray-200);
    }

    .hero-title {
        font-family: 'Playfair Display', serif;
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        background: linear-gradient(135deg, #0a2540 0%, #c9a961 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
</style>
{% endblock %}

{% block content %}
<div class="hero-section">
    <h1 class="hero-title">Add Portfolio Company</h1>
    <p class="hero-subtitle">Add a new company to your investment portfolio</p>
</div>

<div class="card" style="max-width: 700px; margin: 0 auto;">
    <form method="POST">
        <div class="form-group">
            <label for="name">Company Name *</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="industry">Industry</label>
            <input type="text" id="industry" name="industry">
        </div>

        <div class="form-group">
            <label for="fund_id">Fund *</label>
            <select id="fund_id" name="fund_id" required>
                <option value="">Select Fund</option>
                {% for fund in funds %}
                <option value="{{ fund.id }}">{{ fund.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-gold">Add Company</button>
            <a href="/admin/companies" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
