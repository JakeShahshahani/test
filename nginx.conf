# Nginx Configuration for GreatPoint Ventures Portfolio Management
# Place this in /etc/nginx/sites-available/greatpoint-portfolio

upstream greatpoint_app {
    # Gunicorn server
    server 127.0.0.1:8000 fail_timeout=0;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name portfolio.greatpointventures.com;
    
    # Let's Encrypt SSL certificate verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portfolio.greatpointventures.com;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/portfolio.greatpointventures.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.greatpointventures.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # HSTS (optional but recommended)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Client max body size (for file uploads)
    client_max_body_size 20M;
    
    # Logging
    access_log /var/log/nginx/greatpoint-access.log;
    error_log /var/log/nginx/greatpoint-error.log;
    
    # Static files (if you add a static folder later)
    location /static/ {
        alias /var/www/greatpoint-portfolio/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Proxy to Gunicorn
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_pass http://greatpoint_app;
    }
    
    # Health check endpoint (if you add one)
    location /health {
        access_log off;
        proxy_pass http://greatpoint_app;
    }
}
